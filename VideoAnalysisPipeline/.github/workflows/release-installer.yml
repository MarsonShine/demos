name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tools
        shell: powershell
        run: |
          choco install ffmpeg innosetup -y --no-progress

      - name: Build offline end-user installer
        shell: cmd
        run: >
          desktop\build\build_all.bat --clean-engine --allow-network
          --ffmpeg-dir "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoAnalysisDesktop-Setup-x64
          path: desktop/installer/output/VideoAnalysisDesktop-Setup-x64-*.exe
          if-no-files-found: error

      - name: Attach installer to tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME desktop\installer\output\VideoAnalysisDesktop-Setup-x64-*.exe --generate-notes
